name: Bug (crash, wrong exit code, broken output)
description: RepoCanary itself misbehaved. For a security flaw in the tool, use private vulnerability reporting instead (see SECURITY.md).
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: The command you ran, what it printed, and the exit code.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: repocanary 1.0.0, Node 22.x, macOS 15 / the website
