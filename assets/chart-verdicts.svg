<svg xmlns="http://www.w3.org/2000/svg" width="760" height="216" viewBox="0 0 760 216" role="img" aria-labelledby="t d" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
<title id="t">Verdicts on the regression corpus</title>
<desc id="d">Before the yellow review: 73% green, 25% yellow, 2% red of 3,002 repositories. Now: 77% green, 21% yellow, 2% red of 3,398 repositories. Every red is listed with its reason.</desc>
<rect width="760" height="216" fill="none"/>
<text x="20" y="28" font-size="17" font-weight="600" fill="#768390">Verdicts on the regression corpus</text>
<text x="20" y="48" font-size="13" fill="#768390">Public repositories, cloned and scanned; every red is listed with the reason it earns one</text>
<text x="20" y="89" font-size="14" font-weight="600" fill="#768390">Before</text>
<text x="20" y="105" font-size="12" fill="#768390">3,002 repositories</text>
<rect x="150.0" y="76" width="382.0" height="30" rx="3" fill="#0ca30c"/>
<text x="160.0" y="96" font-size="14" font-weight="600" fill="#0d1117">73% green</text>
<rect x="534.0" y="76" width="129.5" height="30" rx="3" fill="#fab219"/>
<text x="544.0" y="96" font-size="14" font-weight="600" fill="#0d1117">25% yellow</text>
<rect x="665.5" y="76" width="8.5" height="30" rx="3" fill="#d03b3b"/>
<text x="682.0" y="96" font-size="14" font-weight="600" fill="#768390">2% red</text>
<text x="20" y="141" font-size="14" font-weight="600" fill="#768390">Now</text>
<text x="20" y="157" font-size="12" fill="#768390">3,398 repositories</text>
<rect x="150.0" y="128" width="403.0" height="30" rx="3" fill="#0ca30c"/>
<text x="160.0" y="148" font-size="14" font-weight="600" fill="#0d1117">77% green</text>
<rect x="555.0" y="128" width="108.5" height="30" rx="3" fill="#fab219"/>
<text x="565.0" y="148" font-size="14" font-weight="600" fill="#0d1117">21% yellow</text>
<rect x="665.5" y="128" width="8.5" height="30" rx="3" fill="#d03b3b"/>
<text x="682.0" y="148" font-size="14" font-weight="600" fill="#768390">2% red</text>
<rect x="20" y="187" width="12" height="12" rx="2" fill="#0ca30c"/>
<text x="38" y="198" font-size="13" fill="#768390">Green: nothing known matched</text>
<rect x="262.79999999999995" y="187" width="12" height="12" rx="2" fill="#fab219"/>
<text x="280.79999999999995" y="198" font-size="13" fill="#768390">Yellow: worth a look</text>
<rect x="448.79999999999995" y="187" width="12" height="12" rx="2" fill="#d03b3b"/>
<text x="466.79999999999995" y="198" font-size="13" fill="#768390">Red: do not run</text>
</svg>