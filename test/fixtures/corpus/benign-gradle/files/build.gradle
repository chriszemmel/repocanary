buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.2.0'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
    }
}

def gitHash = "git rev-parse --short HEAD".execute().text.trim()

task printVersion {
    doLast {
        exec {
            commandLine 'git', 'describe', '--tags'
        }
        println "Version ${gitHash}"
    }
}
